<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16213E" />
<title>Actions Suivi</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FBF9F4; --surface:#FFFFFF; --ink:#16213E; --ink-soft:#5B6478; --line:#EAE6DC;
    --coral:#FF6B4A; --coral-soft:#FFEDE7;
    --amber:#FFB800; --amber-soft:#FFF6DF;
    --emerald:#0FA968; --emerald-soft:#E4F7EE;
    --violet:#6C63FF; --violet-soft:#EEEDFF;
    --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; overscroll-behavior:none;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
  button, a{font-family:inherit; cursor:pointer; text-decoration:none;}
  input{font-family:inherit;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
